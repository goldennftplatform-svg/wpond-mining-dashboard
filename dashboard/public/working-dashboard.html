<!DOCTYPE html>
<html>
<head>
    <title>Working Dashboard - Step by Step</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .card { background: #2d2d2d; padding: 20px; margin: 10px; border-radius: 10px; }
        .value { font-size: 24px; color: #ffd700; font-weight: bold; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #2d5a2d; color: #fff; }
        .error { background: #5a2d2d; color: #fff; }
        .loading { background: #2d2d5a; color: #fff; }
        .winners-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 20px 0; }
        .winner-card { background: #3d3d3d; padding: 15px; border-radius: 8px; border-left: 4px solid #ffd700; }
        .winner-wallet { font-family: monospace; color: #ffd700; margin: 5px 0; }
        .winner-amount { font-size: 18px; color: #fff; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Working Dashboard - Step by Step</h1>
    
    <div id="status" class="status loading">Loading...</div>
    
    <!-- Basic Stats (This part works) -->
    <h2>✅ Basic Stats (Working)</h2>
    <div class="card">
        <h3>Total Claims</h3>
        <div class="value" id="totalClaims">Loading...</div>
    </div>
    
    <div class="card">
        <h3>Total wPOND</h3>
        <div class="value" id="totalWpond">Loading...</div>
    </div>
    
    <div class="card">
        <h3>Biggest Winner</h3>
        <div class="value" id="biggestWinner">Loading...</div>
    </div>
    
    <div class="card">
        <h3>Average Claim</h3>
        <div class="value" id="averageClaim">Loading...</div>
    </div>
    
    <!-- Top Winners (Testing this function) -->
    <h2>🏆 Top Winners (Testing)</h2>
    <div id="topWinnersGrid" class="winners-grid">
        <div class="loading">Loading top winners...</div>
    </div>
    
    <script>
        let dashboardData = null;
        
        // Basic data loading (This works)
        async function loadBasicData() {
            const status = document.getElementById('status');
            try {
                status.textContent = 'Fetching data...';
                status.className = 'status loading';
                
                const response = await fetch('helius-dashboard-data.json');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Data loaded:', data);
                console.log('Data keys:', Object.keys(data));
                
                // Store data globally
                dashboardData = data;
                
                // Update basic stats (This works)
                document.getElementById('totalClaims').textContent = data.summary?.totalClaims?.toLocaleString() || '0';
                document.getElementById('totalWpond').textContent = (data.summary?.totalWpond || 0).toLocaleString() + ' wPOND';
                document.getElementById('biggestWinner').textContent = (data.summary?.biggestAmount || 0).toLocaleString() + ' wPOND';
                document.getElementById('averageClaim').textContent = (data.summary?.averageAmount || 0).toLocaleString() + ' wPOND';
                
                status.textContent = '✅ Basic data loaded successfully!';
                status.className = 'status success';
                
                // Now try to load top winners (This is what we're testing)
                console.log('🔄 Now testing top winners function...');
                updateTopWinners();
                
            } catch (error) {
                console.error('Error:', error);
                status.textContent = '❌ Error: ' + error.message;
                status.className = 'status error';
            }
        }
        
        // Top winners function (This is what we're testing)
        function updateTopWinners() {
            console.log('🏆 updateTopWinners() called');
            const topWinnersGrid = document.getElementById('topWinnersGrid');
            
            if (!dashboardData || !dashboardData.allRecipients) {
                console.log('⚠️ No dashboard data available for top winners');
                topWinnersGrid.innerHTML = '<p>No data available</p>';
                return;
            }
            
            try {
                console.log('📊 Processing', dashboardData.allRecipients.length, 'recipients');
                
                // Get top 10 winners
                const topWinners = dashboardData.allRecipients.slice(0, 10);
                console.log('🏆 Top 10 winners:', topWinners.length);
                
                let html = '';
                topWinners.forEach((winner, index) => {
                    const rank = index + 1;
                    const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                    
                    html += `
                        <div class="winner-card">
                            <div style="font-size: 24px; margin-bottom: 10px;">${rankIcon}</div>
                            <div class="winner-wallet">${winner.wallet}</div>
                            <div class="winner-amount">${(winner.amount || 0).toLocaleString()} wPOND</div>
                            <div style="color: #ccc; font-size: 12px;">Claim #${winner.claimCount || 1}</div>
                        </div>
                    `;
                });
                
                topWinnersGrid.innerHTML = html;
                console.log('✅ Top winners updated successfully');
                
                // Now test the next function
                console.log('🔄 Now testing updateAllWinners function...');
                updateAllWinners();
                
            } catch (error) {
                console.error('❌ Error in updateTopWinners:', error);
                topWinnersGrid.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // All winners function (Testing this next)
        function updateAllWinners() {
            console.log('📊 updateAllWinners() called');
            
            try {
                if (!dashboardData || !dashboardData.allRecipients) {
                    console.log('⚠️ No dashboard data available for all winners');
                    return;
                }
                
                console.log('📊 Processing all', dashboardData.allRecipients.length, 'recipients');
                
                // Just log the first few to see if this function works
                const sampleWinners = dashboardData.allRecipients.slice(0, 5);
                console.log('📊 Sample winners:', sampleWinners.map(w => ({
                    wallet: w.wallet,
                    amount: w.amount,
                    claimCount: w.claimCount
                })));
                
                console.log('✅ updateAllWinners completed successfully');
                
                // Now test the next function
                console.log('🔄 Now testing updateTodaysWinners function...');
                updateTodaysWinners();
                
            } catch (error) {
                console.error('❌ Error in updateAllWinners:', error);
            }
        }
        
        // Today's winners function (Testing this next - likely the problem!)
        function updateTodaysWinners() {
            console.log('🏅 updateTodaysWinners() called');
            
            try {
                if (!dashboardData || !dashboardData.allRecipients) {
                    console.log('⚠️ No dashboard data available for today\'s winners');
                    return;
                }
                
                console.log('📊 Creating simulated recent data...');
                
                // This is the complex part that might be breaking
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                console.log('📅 Today:', today, 'Yesterday:', yesterday);
                
                // Take top 10 winners and simulate recent activity
                const topWinners = dashboardData.allRecipients.slice(0, 10);
                console.log('🏆 Top 10 winners for simulation:', topWinners.length);
                
                const recentData = topWinners.map((winner, index) => ({
                    ...winner,
                    date: index < 5 ? today : yesterday, // First 5 are "today", rest are "yesterday"
                    isRecent: true
                }));
                
                console.log('📊 Simulated recent data created:', recentData.length, 'entries');
                console.log('✅ updateTodaysWinners completed successfully');
                
                // Now test the next function
                console.log('🔄 Now testing updateRecentActivity function...');
                updateRecentActivity();
                
            } catch (error) {
                console.error('❌ Error in updateTodaysWinners:', error);
            }
        }
        
        // Recent activity function (Testing this next)
        function updateRecentActivity() {
            console.log('🕐 updateRecentActivity() called');
            
            try {
                if (!dashboardData || !dashboardData.allRecipients) {
                    console.log('⚠️ No dashboard data available for recent activity');
                    return;
                }
                
                console.log('📊 Processing recent activity...');
                
                // Get the most recent winners (first 5 in the array)
                const recentWinners = dashboardData.allRecipients.slice(0, 5);
                console.log('🕐 Recent winners found:', recentWinners.length);
                
                // Log some sample data
                const sampleActivity = recentWinners.map(w => ({
                    wallet: w.wallet?.substring(0, 8) + '...',
                    amount: w.amount,
                    date: w.date || 'unknown'
                }));
                
                console.log('📊 Sample recent activity:', sampleActivity);
                console.log('✅ updateRecentActivity completed successfully');
                
            } catch (error) {
                console.error('❌ Error in updateRecentActivity:', error);
            }
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadBasicData);
    </script>
</body>
</html>
