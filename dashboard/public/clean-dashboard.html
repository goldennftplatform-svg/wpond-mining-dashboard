<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wPOND Mining Dashboard - Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: 3px solid #000;
            border-radius: 10px;
            box-shadow: 5px 5px 0px #000;
        }

        .header h1 {
            font-size: 24px;
            color: #000;
            text-shadow: 2px 2px 0px #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            border: 2px solid #ff69b4;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 3px 3px 0px #000;
        }

        .stat-value {
            font-size: 18px;
            color: #ff69b4;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .section {
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            border: 2px solid #ff69b4;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 3px 3px 0px #000;
        }

        .section h2 {
            color: #ff69b4;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .top-winners-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .winner-card {
            background: linear-gradient(135deg, #3a3a3a, #2a2a2a);
            border: 2px solid #ff69b4;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .winner-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px #000;
        }

        .winner-card.top-winner {
            border-color: #ffd700;
            background: linear-gradient(135deg, #4a4a4a, #3a3a3a);
        }

        .rank-icon {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .winner-wallet {
            font-size: 8px;
            color: #ccc;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .winner-amount {
            font-size: 12px;
            color: #ff69b4;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .winner-date {
            font-size: 8px;
            color: #999;
        }

        .bubble-board {
            position: relative;
            height: 400px;
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            border: 2px solid #4a90e2;
            border-radius: 8px;
            overflow: hidden;
        }

        .recent-bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #fff;
            text-shadow: 1px 1px 0px #000;
            text-align: center;
            line-height: 1.2;
        }

        .recent-bubble:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .recent-activity-table {
            width: 100%;
            border-collapse: collapse;
        }

        .recent-activity-table th,
        .recent-activity-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #444;
            font-size: 10px;
        }

        .recent-activity-table th {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #000;
            font-weight: bold;
        }

        .recent-activity-table tr:hover {
            background: rgba(255, 105, 180, 0.1);
        }

        .loading {
            text-align: center;
            color: #ff69b4;
            font-size: 14px;
            padding: 40px;
        }

        .no-data {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 40px;
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            50% { transform: translateY(-5px) rotate(-1deg); }
            75% { transform: translateY(-15px) rotate(1deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .top-winners-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- HEADER -->
        <div class="header">
            <h1>🎯 wPOND MINING DASHBOARD</h1>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalClaims">-</div>
                <div class="stat-label">Total Claims</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalWpond">-</div>
                <div class="stat-label">Total wPOND</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRecipients">-</div>
                <div class="stat-label">Total Recipients</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="biggestAmount">-</div>
                <div class="stat-label">Biggest Claim</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="averageAmount">-</div>
                <div class="stat-label">Average Claim</div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- TOP 10 WINNERS SECTION -->
            <div class="section">
                <h2>🏆 TOP 10 WINNERS (By Amount)</h2>
                <div class="top-winners-grid" id="topWinnersGrid">
                    <div class="loading">Loading top winners...</div>
                </div>
            </div>

            <!-- RECENT ACTIVITY SECTION -->
            <div class="section">
                <h2>📊 RECENT ACTIVITY (Last 10 Payouts)</h2>
                <table class="recent-activity-table">
                    <thead>
                        <tr>
                            <th>Wallet</th>
                            <th>Amount</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentActivity">
                        <tr>
                            <td colspan="3" class="loading">Loading recent activity...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- BUBBLE BOARD SECTION -->
        <div class="section">
            <h2>🫧 TOP WINNERS BUBBLE BOARD</h2>
            <div class="bubble-board" id="topWinnersBubbleBoard">
                <div class="loading">Loading bubble board...</div>
            </div>
        </div>
    </div>

    <script src="clean-dashboard.js"></script>
</body>
</html>
