<!DOCTYPE html>
<html>
<head>
    <title>Debug - File Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Debug - File Loading Test</h1>
    <div id="status"></div>
    
    <h2>Testing Files:</h2>
    <button onclick="testFile('test-dashboard-data.json')">Test Small File</button>
    <button onclick="testFile('helius-dashboard-data.json')">Test Large File</button>
    <button onclick="testFile('index.html')">Test HTML</button>
    
    <div id="results"></div>
    
    <script>
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML += `<div class="status ${type}">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }
        
        async function testFile(filename) {
            log(`Testing file: ${filename}`, 'info');
            
            try {
                const url = `${filename}?t=${Date.now()}`;
                log(`Fetching: ${url}`, 'info');
                
                const response = await fetch(url);
                log(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                log(`Response headers: ${JSON.stringify(Object.fromEntries(response.headers))}`, 'info');
                
                if (response.ok) {
                    if (filename.endsWith('.json')) {
                        const data = await response.json();
                        log(`✅ JSON loaded successfully. Size: ${JSON.stringify(data).length} chars`, 'success');
                        log(`Data keys: ${Object.keys(data).join(', ')}`, 'info');
                    } else {
                        const text = await response.text();
                        log(`✅ File loaded successfully. Size: ${text.length} chars`, 'success');
                    }
                } else {
                    log(`❌ HTTP Error: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Fetch error: ${error.message}`, 'error');
            }
            
            log('---', 'info');
        }
        
        // Auto-test on load
        window.onload = () => {
            log('Debug page loaded. Testing files...', 'info');
            setTimeout(() => testFile('test-dashboard-data.json'), 1000);
        };
    </script>
</body>
</html>
