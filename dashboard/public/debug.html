<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Debug</title>
</head>
<body>
    <h1>Dashboard Debug</h1>
    <div id="debugStatus">Loading...</div>
    <div id="dataOutput"></div>
    
    <script>
        async function testDataLoading() {
            const debugStatus = document.getElementById('debugStatus');
            const dataOutput = document.getElementById('dataOutput');
            
            try {
                debugStatus.textContent = 'Testing data loading...';
                
                // Test 1: Check if we can access the data file
                const dataUrl = 'helius-dashboard-data.json?v=' + Date.now();
                console.log('Testing URL:', dataUrl);
                
                const response = await fetch(dataUrl);
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Data loaded successfully:', data);
                console.log('Data keys:', Object.keys(data));
                
                debugStatus.textContent = '✅ Data loaded successfully!';
                debugStatus.style.background = '#2d5a2d';
                debugStatus.style.color = 'white';
                debugStatus.style.padding = '10px';
                debugStatus.style.borderRadius = '5px';
                
                // Display some data
                dataOutput.innerHTML = `
                    <h2>Data Summary:</h2>
                    <p><strong>Total Claims:</strong> ${data.summary?.totalClaims || 'N/A'}</p>
                    <p><strong>Total wPOND:</strong> ${data.summary?.totalWpond || 'N/A'}</p>
                    <p><strong>Total Recipients:</strong> ${data.allRecipients?.length || 'N/A'}</p>
                    <p><strong>Sample Recipient:</strong> ${data.allRecipients?.[0]?.wallet || 'N/A'}</p>
                `;
                
            } catch (error) {
                console.error('Error loading data:', error);
                debugStatus.textContent = `❌ Error: ${error.message}`;
                debugStatus.style.background = '#5a2d2d';
                debugStatus.style.color = 'white';
                debugStatus.style.padding = '10px';
                debugStatus.style.borderRadius = '5px';
                
                dataOutput.innerHTML = `
                    <h2>Error Details:</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Stack:</strong> ${error.stack}</p>
                `;
            }
        }
        
        // Run the test when page loads
        document.addEventListener('DOMContentLoaded', testDataLoading);
    </script>
</body>
</html>
