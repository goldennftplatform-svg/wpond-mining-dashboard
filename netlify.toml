[build]
  # Publish static dashboard only — avoid dashboard/package.json npm install + LFS hell
  command = "echo 'static publish only'"
  publish = "dashboard/public"

[build.environment]
  NODE_VERSION = "18"
  GIT_LFS_SKIP_SMUDGE = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
