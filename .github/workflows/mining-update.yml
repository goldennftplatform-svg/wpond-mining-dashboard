name: wPOND daily claim update

on:
  schedule:
    # every 6 hours at :17 past (UTC)
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mining-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh live claims feed (dashboard JSON)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/refresh-recent-claims.js

      - name: Incremental tracker update (archive + last-processed)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node schedule-updates.js force

      - name: Commit fresh data
        run: |
          git config user.name "wpond-bot"
          git config user.email "wpond-bot@users.noreply.github.com"
          git add -A data dashboard/public
          if git diff --cached --quiet; then
            echo "No new claims to commit"
          else
            git commit -m "Auto-update mining claims $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
