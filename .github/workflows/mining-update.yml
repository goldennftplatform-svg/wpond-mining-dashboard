name: wPOND daily claim update

on:
  schedule:
    # every 15 minutes (GitHub Actions floor is 5; 15 keeps delays rare)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mining-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh live claims feed (dashboard JSON)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/refresh-recent-claims.js

      - name: Incremental tracker update (archive + last-processed)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node schedule-updates.js force

      - name: Sweeper (helius-dashboard-data for alt pages)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          node dashboard/daily-tx-sweeper.js
          cp dashboard/public/helius-dashboard-data.json dashboard/public/helius-dashboard-data-fresh.json

      - name: Stage site for Pages (docs/)
        run: |
          rm -rf docs
          mkdir docs
          cp -r dashboard/public/. docs/
          touch docs/.nojekyll

      - name: Commit fresh data
        run: |
          git config user.name "wpond-bot"
          git config user.email "wpond-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data docs dashboard/public
          if git diff --cached --quiet; then
            echo "No new claims to commit"
          else
            git commit -m "Auto-update mining claims $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
